services:
  odysseus:
    build: .
    networks:
      - dokploy-network
      - default
    volumes:
      - odysseus-data:/app/data:z
      - odysseus-logs:/app/logs:z
      - odysseus-ssh:/app/.ssh:z
      - odysseus-hf:/app/.cache/huggingface:z
      - odysseus-local:/app/.local:z
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=llm.savetec.com
      - LLM_HOSTS=
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      - OLLAMA_BASE_URL=https://llm.savetec.com/v1
      - RESEARCH_LLM_ENDPOINT=
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=sqlite:///./data/app.db
      - AUTH_ENABLED=true
      - LOCALHOST_BYPASS=false
      - ODYSSEUS_ADMIN_USER=admin
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=https://odysseus.savetec.com.py
      - SECURE_COOKIES=true
      - EMBEDDING_URL=https://llm.savetec.com/v1/embeddings
      - EMBEDDING_MODEL=
      - EMBEDDING_API_KEY=${LITELLM_API_KEY}
      - FASTEMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CLEANUP_INTERVAL_HOURS=24
      - ODYSSEUS_INPROCESS_POLLERS=1
      - ODYSSEUS_INPROCESS_TASKS=1
      - ODYSSEUS_SCRIPT_HOST=localhost
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=10485760
      - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=104857600
      - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=26214400
      - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=10485760
      - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=26214400
      - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=26214400
      - ODYSSEUS_STT_MAX_AUDIO_BYTES=26214400
      - ODYSSEUS_ICS_MAX_BYTES=10485760
      - PUID=1000
      - PGID=1000
    depends_on:
      searxng:
        condition: service_started
      chromadb:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.odysseus-http.rule=Host(`odysseus.savetec.com.py`)"
      - traefik.http.routers.odysseus-http.entrypoints=web
      - traefik.http.routers.odysseus-http.service=odysseus-svc
      - "traefik.http.routers.odysseus-https.rule=Host(`odysseus.savetec.com.py`)"
      - traefik.http.routers.odysseus-https.entrypoints=websecure
      - traefik.http.routers.odysseus-https.tls=true
      - traefik.http.routers.odysseus-https.tls.certresolver=letsencrypt
      - traefik.http.routers.odysseus-https.service=odysseus-svc
      - traefik.http.services.odysseus-svc.loadbalancer.server.port=7000
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    networks:
      - default
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    networks:
      - default
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    networks:
      - default
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=http://localhost:8091
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  default:

volumes:
  odysseus-data:
  odysseus-logs:
  odysseus-ssh:
  odysseus-hf:
  odysseus-local:
  chromadb-data:
  searxng-data:
  ntfy-cache:
